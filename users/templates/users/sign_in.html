{% extends 'users/base.html' %}

{% block title %} Вход {% endblock %}

{% block inputs %}
    <input name="username" placeholder="Имя пользователя" type="text" class="border border-gray-300 p-2 rounded-md focus:outline-none focus:border-indigo-600 focus:border-2">
    <input name="password" placeholder="Пароль" type="password" class="border border-gray-300 p-2 rounded-md focus:outline-none focus:border-indigo-600 focus:border-2">
{% endblock %}

{% block form_title %} Вход {% endblock %}

{% block button %} Войти {% endblock %}

{% block after_form %}
    <p class="text-center mt-4 text-sm text-gray-600">
        Нет аккаунта? <a href="{% url 'register' %}" class="text-indigo-600 hover:text-indigo-800 font-medium underline">Зарегистрироваться</a>
    </p>
{% endblock %}
